# Calls the 5-minute housekeeping jobs. Vercel Hobby only runs crons once a day, so these
# run from here instead; the daily retention job stays in vercel.json. GitHub may start a
# scheduled run late or skip one under load, which is fine: buyers never wait on these.
name: Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Send queued emails
        run: >
          curl --fail-with-body --silent --show-error --max-time 60
          -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/dispatch-emails"
      - name: Settle orders and release expired holds
        if: ${{ !cancelled() }}
        run: >
          curl --fail-with-body --silent --show-error --max-time 60
          -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/sweep"
